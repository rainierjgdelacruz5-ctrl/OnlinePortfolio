        <form>

        <label> STUDENT REGISTRATION FORM</label>
        <label> STUDENT NAME</label><br>
        <input type="text" required><br>
        <label> EMAIL</label><br>
        <input type="email"><br>
        <label> PASSWORD</label><br>
        <input type="password"><br>
        <label> GENDER</label><br>
        <input type="radio" name="GENDER" value="male"> Male
        <input type="radio" name="GENDER" value="female"> Female<br><br>
        <label> COURSE</label><br>
        <br>
        <select name="dropdown">
            <option value="BSIT" selected>BSIT</option>
            <option value="BSCS" selected>BSCS</option>
            <option value="BSTM" selected>BSTM</option>
            <option value="BSHM" selected>BSHM</option>
        </select>

        <label> SKILLS </label><br>
        <input type="checkbox" name="HTML" value="on">HTML
        <input type="checkbox" name="CSS" value="on">CSS
        <input type="checkbox" name="JAVA" value="on">JAVASCRIPT<br>

        <label> PROFILE PICTURE </label><br>
        <br>
        <input type="file" name ="fileupload"
        accept="image/*"/> <br>


        <br>
        <textarea rows="5" cols="50"
        name="description" placeholder="ENTER DESCRIPTION HERE">
        </textarea><br>


        <button type="submit"> SUBMIT </button>
        </form>
